name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit, mocked WordPress, lint, static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint
      - run: composer analyse

  integration:
    name: Integration (real WordPress + WooCommerce via wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wp-env start
      - run: npm run test:integration
